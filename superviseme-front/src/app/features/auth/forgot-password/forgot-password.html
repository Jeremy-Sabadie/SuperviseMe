<main class="login-page">
  <section class="login-card">
    <div class="brand">
      <div class="brand-icon">S</div>
      <h1>SuperviseMe</h1>
    </div>

    <h2>Mot de passe oublié ?</h2>
    <p>Saisissez votre adresse e-mail pour récupérer vos accès.</p>

    <form (ngSubmit)="envoyer()">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email"
             autocomplete="email" [(ngModel)]="email"
             required maxlength="254">

      @if (message()) {
        <p role="status">{{ message() }}</p>
      }
      @if (erreur()) {
        <p role="alert">{{ erreur() }}</p>
      }

      <button type="submit" [disabled]="chargement()">
        {{ chargement() ? 'Envoi...' : 'Recevoir un lien' }}
      </button>
    </form>

    <p><a class="auth-return-link" routerLink="/login">Retour à la connexion</a></p>
  </section>
</main>
