<main class="login-page">
  <section class="login-card">
    <div class="brand">
      <div class="brand-icon">S</div>
      <h1>SuperviseMe</h1>
    </div>

    <h2>Nouveau mot de passe</h2>

    @if (!token) {
      <p role="alert">Lien invalide ou incomplet.</p>
    } @else if (termine()) {
      <p role="status">Mot de passe modifié avec succès.</p>
    } @else {
      <form (ngSubmit)="reinitialiser()">
        <label for="password">Nouveau mot de passe</label>
        <input id="password" name="password" type="password"
               autocomplete="new-password"
               [(ngModel)]="motDePasse" required minlength="12"
               maxlength="128">

        <label for="confirmation">Confirmer le mot de passe</label>
        <input id="confirmation" name="confirmation" type="password"
               autocomplete="new-password"
               [(ngModel)]="confirmation" required>

        @if (erreur()) {
          <p role="alert">{{ erreur() }}</p>
        }

        <button type="submit" [disabled]="chargement()">
          {{ chargement() ? 'Modification...' : 'Modifier mon mot de passe' }}
        </button>
      </form>
    }

    <p class="signup-link">
      <a routerLink="/login">Retour à la connexion</a>
    </p>
  </section>
</main>
