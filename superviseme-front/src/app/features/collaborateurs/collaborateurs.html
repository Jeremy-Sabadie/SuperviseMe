<main class="collaborateurs-page">
  <section class="collaborateurs-card">
    <a class="retour" routerLink="/">← Retour au Kanban</a>

    <h1>Gestion des collaborateurs</h1>
    <p class="description">
      Ajoutez un membre à votre équipe.
      Son compte disposera du rôle Collaborateur.
    </p>

    <form (ngSubmit)="ajouter()">
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="off" 
        placeholder="collaborateur@entreprise.fr"
        required
      />

      <label for="motDePasse">Mot de passe</label>
      <input
        id="motDePasse"
        type="password"
        name="motDePasse"
        [(ngModel)]="motDePasse"
        autocomplete="new-password"
        required
        minlength="8"
      />

      @if (erreur()) {
        <p class="message erreur" role="alert">{{ erreur() }}</p>
      }

      @if (succes()) {
        <p class="message succes" role="status">{{ succes() }}</p>
      }

      <button type="submit" [disabled]="chargement()">
        {{ chargement() ? 'Création...' : 'Ajouter le collaborateur' }}
      </button>
    </form>
  </section>
</main>
