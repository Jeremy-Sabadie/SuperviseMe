# Configuration réservée à la production SuperviseMe

spring.config.activate.on-profile=prod

# Aucune valeur de secours en production.
spring.datasource.url=${SUPERVISEME_PROD_DB_URL}
spring.datasource.username=${SUPERVISEME_PROD_DB_USERNAME}
spring.datasource.password=${SUPERVISEME_PROD_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Ne pas activer les traces détaillées de sécurité.

# SEC-07 : durcissement production
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.max-http-request-header-size=8KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health
logging.level.org.springframework.security=WARN
server.shutdown=graceful
