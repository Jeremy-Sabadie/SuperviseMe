spring.application.name=superviseme-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/superviseme}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:superviseme}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Validation des JWT emis par le futur service d'authentification.
# L'URI doit pointer vers les cles publiques du fournisseur de JWT.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPERVISEME_JWK_SET_URI:http://127.0.0.1:9999/.well-known/jwks.json}

# Clés RSA propres à chaque instance cliente.
superviseme.jwt.private-key=${SUPERVISEME_JWT_PRIVATE_KEY}
superviseme.jwt.public-key=${SUPERVISEME_JWT_PUBLIC_KEY}
