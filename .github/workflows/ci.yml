
name: SuperviseMe CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Angular - Tests et Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: superviseme-front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: superviseme-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests
        run: npm test -- --watch=false

      - name: Build Angular
        run: npm run build

  backend:
    name: Spring Boot - Tests et Build
    runs-on: ubuntu-latest

    env:
      SPRING_DATASOURCE_USERNAME: superviseme
      SPRING_DATASOURCE_PASSWORD: ci_test_password

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: superviseme_test
          POSTGRES_USER: superviseme
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superviseme -d superviseme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: superviseme-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: superviseme-api/pom.xml

      - name: Generate ephemeral CI RSA keys
        run: |
          key_file="$(mktemp)"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_file" 2>/dev/null
          echo "SUPERVISEME_JWT_PRIVATE_KEY=$(openssl pkcs8 -topk8 -nocrypt -in "$key_file" -outform DER | base64 -w0)" >> "$GITHUB_ENV"
          echo "SUPERVISEME_JWT_PUBLIC_KEY=$(openssl pkey -in "$key_file" -pubout -outform DER | base64 -w0)" >> "$GITHUB_ENV"
          rm -f "$key_file"

      - name: Run JUnit tests and build
        run: ./mvnw -B clean verify

  docker:
    name: Docker - Stack Integration
    runs-on: ubuntu-latest

    # Attendre les validations Angular et Spring Boot
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ephemeral CI RSA keys
        run: |
          key_file="$(mktemp)"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_file" 2>/dev/null
          echo "SUPERVISEME_JWT_PRIVATE_KEY=$(openssl pkcs8 -topk8 -nocrypt -in "$key_file" -outform DER | base64 -w0)" >> "$GITHUB_ENV"
          echo "SUPERVISEME_JWT_PUBLIC_KEY=$(openssl pkey -in "$key_file" -pubout -outform DER | base64 -w0)" >> "$GITHUB_ENV"
          rm -f "$key_file"

      # Vérifier la syntaxe et les variables Docker Compose
      - name: Validate Docker Compose
        run: docker compose -f compose.ci.yaml config --quiet

      # Construire les images et démarrer les trois services
      - name: Build and start the three containers
        run: |
          docker compose -p superviseme-ci -f compose.ci.yaml up             -d --build --wait --wait-timeout 180

      # Tester le frontend et le routage Nginx vers l'API
      - name: Verify frontend and API through Nginx
        run: |
          success=0

          # Attendre au maximum 180 secondes
          for i in $(seq 1 60); do

            # La route Angular doit répondre HTTP 200
            front=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18093/login || true)

            # Une route API protégée doit refuser l'accès anonyme
            api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18093/api/auth/me || true)

            echo "Attempt $i: frontend=$front API=$api"

            if [ "$front" = "200" ] && { [ "$api" = "401" ] || [ "$api" = "403" ]; }; then
              success=1
              break
            fi

            sleep 3
          done

          # Échouer si les vérifications ne passent pas
          if [ "$success" != "1" ]; then
            echo "ERREUR : vérification HTTP de la stack"
            exit 1
          fi

          docker compose -p superviseme-ci -f compose.ci.yaml ps

      # Tester les endpoints API après le démarrage de la stack.
      # Une assertion Newman en échec fait échouer ce job.
      - name: Run Newman API tests
        run: |
          mkdir -p reports

          npx --yes newman@6.2.1 run \
            tests/newman/superviseme.postman_collection.json \
            --reporters cli,junit \
            --reporter-junit-export reports/newman-results.xml \
            --timeout-request 10000

      # Conserver les résultats même lorsque les tests échouent.
      # Le rapport JUnit sera téléchargeable depuis GitHub Actions.
      - name: Upload Newman test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-results
          path: reports/newman-results.xml
          if-no-files-found: ignore

      # Afficher les journaux si une étape échoue
      - name: Show logs on failure
        if: failure()
        run: docker compose -p superviseme-ci -f compose.ci.yaml logs --tail=100

      # Toujours supprimer les conteneurs et volumes temporaires
      - name: Stop and remove test stack
        if: always()
        run: docker compose -p superviseme-ci -f compose.ci.yaml down -v --remove-orphans
