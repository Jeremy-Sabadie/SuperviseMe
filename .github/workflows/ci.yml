
name: SuperviseMe CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Angular - Tests et Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: superviseme-front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: superviseme-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Angular tests
        run: npm test -- --watch=false

      - name: Build Angular
        run: npm run build

  backend:
    name: Spring Boot - Tests et Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: superviseme-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: superviseme-api/pom.xml

      - name: Run JUnit tests and build
        run: ./mvnw -B clean verify

  docker:
    name: Docker - Build Stack
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t superviseme-api:ci ./superviseme-api

      - name: Build Angular Docker image
        run: docker build -t superviseme-front:ci ./superviseme-front
